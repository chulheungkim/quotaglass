[package]
name = "claude-usage-widget"
version = "0.1.0"
description = "Claude Code usage widget"
authors = ["chulheong"]
edition = "2021"

[lib]
name = "claude_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# macOS-native login item registration (SMAppService, macOS 13+).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
# NSEvent::pressedMouseButtons — detect the real left-mouse-up to end a drag.
objc2-app-kit = { version = "0.3", features = ["NSEvent"] }
